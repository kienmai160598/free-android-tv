plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.0.0 (beta)'
        // English and Vietnamese only: other locales were removed, and this keeps library strings out too.
        resourceConfigurations += ['en', 'vi']
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = variant.buildType.name == 'release' ? 'km-launcher.apk' : "km-launcher-${variant.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Material colour utilities (dynamic colour from the wallpaper: QuantizerCelebi, Score, SchemeTonalSpot), the
    // com.google.android.material.color.utilities classes of material 1.12.0 (Apache 2.0) on their own: the full
    // library brings AppCompat, its resources and a startup provider for nothing the launcher uses.
    implementation files('libs/material-color-utilities-1.12.0.jar')
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
