plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 7
        // A release sets it from its tag (-PkmVersion=1.1.0); the code stays put, so a local build still installs over it.
        versionName findProperty('kmVersion') ?: '1.0.2'
        // English and Vietnamese only: other locales were removed, and this keeps library strings out too.
        resourceConfigurations += ['en', 'vi']
    }

    signingConfigs {
        // GitHub releases are signed with the owner's key from the repo's secrets (release.yml), so a downloaded
        // APK installs over a local build. Without KM_KEYSTORE, builds keep Android's debug key.
        if (System.getenv('KM_KEYSTORE')) {
            release {
                storeFile file(System.getenv('KM_KEYSTORE'))
                storePassword System.getenv('KM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KM_KEY_ALIAS')
                keyPassword System.getenv('KM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never on a store: the debug key, or the release key when CI has it.
            signingConfig System.getenv('KM_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = variant.buildType.name == 'release' ? 'km-launcher.apk' : "km-launcher-${variant.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // Kotlin metadata the libraries carry, read only by kotlin-reflect, which a Java app never loads (~9 KB).
        resources.excludes += ['kotlin/**', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Material colour utilities (dynamic colour from the wallpaper: QuantizerCelebi, Score, SchemeTonalSpot), the
    // com.google.android.material.color.utilities classes of material 1.12.0 (Apache 2.0) on their own: the full
    // library brings AppCompat, its resources and a startup provider for nothing the launcher uses.
    implementation files('libs/material-color-utilities-1.12.0.jar')
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
