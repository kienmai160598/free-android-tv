name: Setup Go
description: Install tvctl's Go version; the build cache only on GitHub-hosted runners

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: apps/tvctl/go.mod
        cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-path: apps/tvctl/go.mod
