name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  launcher:
    name: Launcher
    uses: ./.github/workflows/launcher.yml
    with:
      changed: true
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Publish tvctl and the launcher
    needs: launcher
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: apps/tvctl
    env:
      CGO_ENABLED: "0"
      TARGETS: >-
        darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - run: go test ./...

      - name: Cross-compile
        run: |
          for target in $TARGETS; do
            os=${target%/*}
            arch=${target#*/}
            extension=""
            [ "$os" = windows ] && extension=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/tvctl-$os-$arch$extension" ./cmd/tvctl
          done

      - uses: actions/download-artifact@v7
        with:
          name: km-launcher
          path: apps/tvctl/dist

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
