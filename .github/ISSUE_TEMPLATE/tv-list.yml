name: My TV
description: A TV that is not in packages/debloat-lists/ yet, or a list that needs a change
title: "[TV] Brand Model (Android version)"
labels: [tv-list]
body:
  - type: markdown
    attributes:
      value: |
        Lists people have tested live in [`packages/debloat-lists/`](../tree/main/packages/debloat-lists). If you already have a working list, a pull request is even better: see [docs/contributing.md](../blob/main/CONTRIBUTING.md).
  - type: input
    id: model
    attributes:
      label: TV model
      description: "`scripts/tvctl probe` prints the model, device codename, Android version and build."
      placeholder: Sony BRAVIA KD-55X8509C (SVP-DTV15)
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and firmware build
      placeholder: Android TV 11, build RTT1.230922.001
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: How far did you get?
      options:
        - Could not connect over ADB
        - Debloat worked, launcher did not
        - Both worked, here is my list
        - Something broke after the debloat
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you ran, what the TV did, what you expected. Paste the packages you disabled if you have them.
      render: shell
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: "Optional. `scripts/tvctl shell 'screencap -p /sdcard/s.png'` then `scripts/tvctl pull /sdcard/s.png s.png`, and drop the file here."
